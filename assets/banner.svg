<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Abstract Diffusion/Transformer Graph Shapes -->
  <g opacity="0.25">
    <!-- Connections -->
    <line x1="150" y1="100" x2="300" y2="250" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="300" y1="250" x2="450" y2="120" stroke="#a855f7" stroke-width="1.5" />
    <line x1="450" y1="120" x2="600" y2="300" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="600" y1="300" x2="750" y2="150" stroke="#6366f1" stroke-width="2" />
    <line x1="750" y1="150" x2="950" y2="280" stroke="#a855f7" stroke-width="1.5" />
    <line x1="950" y1="280" x2="1050" y2="100" stroke="#ec4899" stroke-width="2" />

    <!-- Nodes -->
    <circle cx="150" cy="100" r="6" fill="#6366f1" filter="url(#glow)" />
    <circle cx="300" cy="250" r="8" fill="#a855f7" filter="url(#glow)" />
    <circle cx="450" cy="120" r="7" fill="#ec4899" filter="url(#glow)" />
    <circle cx="600" cy="300" r="10" fill="#6366f1" filter="url(#glow)" />
    <circle cx="750" cy="150" r="8" fill="#a855f7" filter="url(#glow)" />
    <circle cx="950" cy="280" r="7" fill="#ec4899" filter="url(#glow)" />
    <circle cx="1050" cy="100" r="9" fill="#6366f1" filter="url(#glow)" />
  </g>

  <!-- Giant Background Ring for depth -->
  <circle cx="1100" cy="200" r="250" fill="none" stroke="url(#primary-grad)" stroke-width="1" opacity="0.1" />
  <circle cx="100" cy="300" r="180" fill="none" stroke="url(#primary-grad)" stroke-width="2" opacity="0.05" />

  <!-- Content Group -->
  <g transform="translate(100, 0)">
    <!-- Decorative Tag -->
    <rect y="115" width="220" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
    <text x="110" y="133" fill="#a5b4fc" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="210" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="54" font-weight="800" fill="url(#primary-grad)" letter-spacing="1">
      Diffusion Transformers
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#9ca3af" letter-spacing="0.5">
      A curated collection of DiT variants, architectures, and production applications.
    </text>

    <!-- Tech Badges inside Banner -->
    <g transform="translate(0, 300)">
      <rect width="90" height="24" rx="6" fill="#1f2937" />
      <text x="45" y="16" fill="#e5e7eb" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Transformers</text>

      <rect x="105" width="70" height="24" rx="6" fill="#1f2937" />
      <text x="140" y="16" fill="#e5e7eb" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Diffusion</text>

      <rect x="190" width="80" height="24" rx="6" fill="#1f2937" />
      <text x="230" y="16" fill="#e5e7eb" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Generative AI</text>
    </g>
  </g>
</svg>
